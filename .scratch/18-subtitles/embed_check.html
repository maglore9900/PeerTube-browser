<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S0 embed API check</title>
<!-- Throwaway: the official PeerTube embed API client (@peertube/embed-api), a local copy fetched from unpkg. -->
<script src="player.min.js"></script>
<style>
  body { font-family: sans-serif; margin: 1.5rem; max-width: 980px; }
  input[type=text] { width: 70%; }
  textarea { width: 100%; height: 8rem; font-family: monospace; }
  .frame { position: relative; width: 960px; aspect-ratio: 16 / 9; background: #000; }
  /* Same attributes as client/frontend/video-page.html's #video-embed. */
  .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .cue { position: absolute; left: 5%; right: 5%; bottom: 12%; text-align: center; pointer-events: none;
         color: #fff; font-size: 1.4rem; text-shadow: 0 0 4px #000, 0 0 4px #000; white-space: pre-wrap; }
  #status { font-family: monospace; margin: .5rem 0; }
  #log { font-family: monospace; font-size: .85rem; height: 9rem; overflow: auto; background: #f4f4f4; padding: .4rem; }
</style>
</head>
<body>
<h1>Embed API check</h1>
<p>PeerTube watch URL: <input id="url" type="text" placeholder="https://host/w/<id>">
   <label><input id="api" type="checkbox" checked> ?api=1</label>
   <button id="load">Load</button></p>
<p>Lines file (next to this page): <input id="cuefile" type="text" value="italian.txt"> — used when the box below is empty.</p>
<p>Optional: paste translate_stream.py output lines to overlay them:</p>
<textarea id="cues" placeholder="[0:00:01 -> 0:00:05] At the end of ..."></textarea>
<div id="status">not loaded</div>
<div class="frame">
  <iframe id="video-embed" title="Video player" allowfullscreen referrerpolicy="no-referrer"
          sandbox="allow-scripts allow-same-origin"></iframe>
  <div class="cue" id="cue"></div>
</div>
<div id="log"></div>
<script>
const $ = (id) => document.getElementById(id);
const log = (msg) => { const line = document.createElement("div"); line.textContent = `${new Date().toLocaleTimeString()} ${msg}`; $("log").prepend(line); };

function embedUrl(watch, withApi) {
  const u = new URL(watch);
  const id = u.pathname.split("/").filter(Boolean).pop();
  return `https://${u.host}/videos/embed/${encodeURIComponent(id)}${withApi ? "?api=1" : ""}`;
}

function parseCues(text) {
  const toSec = (t) => t.split(":").reduce((acc, p) => acc * 60 + Number(p), 0);
  const cues = [];
  for (const line of text.split("\n")) {
    const m = line.match(/^\[(\d+:\d\d:\d\d) -> (\d+:\d\d:\d\d)\]\s*(.*)$/);
    if (m) cues.push({ start: toSec(m[1]), end: toSec(m[2]), text: m[3] });
  }
  return cues;
}

let updates = 0;
$("load").onclick = async () => {
  const iframe = $("video-embed");
  const src = embedUrl($("url").value.trim(), $("api").checked);
  iframe.src = src;
  updates = 0;
  log(`loading ${src}`);
  $("status").textContent = "waiting for player.ready ...";
  let text = $("cues").value;
  if (!text.trim() && $("cuefile").value.trim()) {
    const resp = await fetch($("cuefile").value.trim(), { cache: "no-store" });
    text = resp.ok ? await resp.text() : "";
    log(`lines file ${$("cuefile").value.trim()}: HTTP ${resp.status}`);
  }
  const cues = parseCues(text);
  log(`${cues.length} cues parsed`);
  const timeout = setTimeout(() => { if (!updates) $("status").textContent = "NO API RESPONSE after 20 s"; }, 20000);
  try {
    const player = new PeerTubePlayer(iframe);
    await player.ready;
    log("player.ready resolved");
    player.addEventListener("playbackStatusChange", (state) => log(`state: ${state}`));
    player.addEventListener("playbackStatusUpdate", (s) => {
      updates++;
      clearTimeout(timeout);
      $("status").textContent = `position ${Number(s.position).toFixed(1)} s / ${s.duration} s, state ${s.playbackState}, updates ${updates}`;
      const cue = cues.find((c) => s.position >= c.start && s.position < c.end);
      $("cue").textContent = cue ? cue.text : "";  // text only, never HTML
    });
  } catch (err) {
    log(`error: ${err}`);
    $("status").textContent = `error: ${err}`;
  }
};
</script>
</body>
</html>
