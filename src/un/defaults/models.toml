# What un knows about a model: how big its window is, and what its tokens cost.
#
# `context` is the input window in TOKENS. Prices are US dollars per MILLION tokens, one
# per token kind, because a cached read and a fresh one are not billed alike and a single
# input rate is wrong in both directions at once.
#
# NO VENDOR ENDPOINT REPORTS A RATE, so every price here is hand-maintained and goes stale
# the day a vendor changes one. Windows differ by vendor. Anthropic's /v1/models/{id}
# reports max_input_tokens, which the stock anthropic adaptor's probe reads, and a probed
# window outranks this table's `context`. OpenAI's endpoint returns identity only (id,
# created, object, owned_by, shutdown_date), so an openai model's window comes from here
# or from the operator's entry.
#
# Probes are per adaptor: probe:anthropic in the stock anthropic adaptor, and ollama's
# /api/show in its own provider plugin. A session on an adaptor with no probe, such as
# claude-code, sizes its window from this table. See
# docs/project/plans/archive/41b-provider-window-probe.md for that seam.
#
# `un install` copies this file to .un/models.toml, which is the copy un reads and the one
# to edit. This packaged master is the fallback for a project that has no copy. A
# [models."<name>"] block in .un/config.toml layers over whichever is in force, field by
# field, so correcting one rate is one line.
#
# A model absent from every layer is unpriced and unsized, and every surface omits the
# field rather than inventing a number.

[models."claude-opus-5"]
context     = 1000000
input       = 5.0
output      = 25.0
cache_read  = 0.5
cache_write = 6.25

[models."claude-sonnet-5"]
context     = 1000000
input       = 2.0
output      = 10.0
cache_read  = 0.2
cache_write = 2.5

[models."claude-haiku-4-5"]
context     = 200000
input       = 1.0
output      = 5.0
cache_read  = 0.1
cache_write = 1.25
