# default - what un renders with when no skin is named. This file IS the built-in table:
# `theme.py` reads it at import, and `un install` copies it to .un/themes/default.toml.
# Editing the copy restyles your project; editing this one changes what un ships with.
#
# It mirrors nord-theme.toml value for value today. Two files rather than one so the default can be retuned without changing what `theme = "nord"` gives an operator who  asked for that palette by name.
#
# See ember.toml for what each role is.
#
# A key says what the text IS, never what it looks like - `tool_result`, not `dim cyan` - which is what lets a skin restyle without the renderer knowing it did. Values are rich style strings and pass through untouched.

[roles]
# The model's own prose. A mid grey rather than a near-white: at #d8dee9 it sat within 12 points of `user_text` on every channel, so the answer and the operator's own line read as one colour.
assistant = "#9e9e9e"
# What un itself says rather than the model: a slash result, a refusal, an advisory from a plugin. Its own role so a skin can set it apart from `assistant`; it ships at the same value.
note = "#9e9e9e"
bullet = "#88c0d0"
tool = "bold #81a1c1"
tool_result = "dim #d8dee9"
# The `name:` in front of a reply or a tool call - `main`, or the subagent that made it.
agent = "#ebcb8b"
# The `>` marker, and the operator's own text beside it. Two roles rather than one so a skin can mark without colouring the prose, or the other way round.
#
# An explicit triplet rather than `white`: rich reads `white` as ANSI colour 7, which a terminal paints with the same grey it paints `default` - so the operator's own line and the model's answer arrived the same colour whatever the two roles said.
user = "bold #ffffff"
user_text = "#ffffff"
# Inside the welcome box: the art or wordmark, then the version, session and path lines. Two roles rather than one so the art can be recoloured without the lines under it moving. The rules around them are `border`.
banner_art = "#88c0d0"
banner_text = "#9e9e9e"
error = "bold #bf616a"
interrupted = "bold #d08770"
status = "dim #6c7a94"
# The clock in front of each conversation line, in your local time.
time = "dim #6c7a94"
waiting = "#ebcb8b"
border = "dim #5e81ac"
# A line committed with an Enter while a turn was still running: typed, not yet run.
pending = "dim #ebcb8b"
# The choice modal while it is open - its border and its text. A role of its own rather than `user_text`, because what it holds is the model's question rather than the operator's prose; what it marks is that an answer is owed.
ask = "#ffffff"
code = "nord-darker"

# The characters the screen is drawn with: every rule and border - the banner, the input frame and the choice modal - and the two marks in the conversation's gutter. Optional like the roles above and merged the same way, per key: name `horizontal` alone and the corners stay built-in. The nine below are the WHOLE set, and these values ARE the built-in ones. An ascii set - "+" corners and "-" fill - suits a terminal whose font draws box characters at a mismatched weight.
[glyphs]
top_left = "╭"
top_right = "╮"
bottom_left = "╰"
bottom_right = "╯"
horizontal = "─"
vertical = "│"
# The fill for the rules `[decorators]` fences the conversation with. Its own key rather than the box rule's, so a skin can move one without the other; it ships as the same character so the built-in screen reads as one box.
inner_divider = "─"
# The gutter's two marks: the one in front of a prose line - a reply, a tool call, an error - and the one in front of what you typed, in the conversation and in the input box alike. The mark a tool result carries, `⎿`, is not here: it says "this came back from that", which is grammar rather than decoration, so it stays fixed. Which role paints a mark follows the line it sits on: `bullet` on a reply, a tool call and a tool result, `user` on an echoed line, `error` on an error, `interrupted` on an ended turn, and `banner_text` on the banner's two rows.
#
# The wider of these two sets the gutter's width, so every row starts its text in the same column whichever mark precedes it.
bullet = "⏺"
user = ">"

# Elements the screen can carry beyond the conversation and its footer. The two below are the WHOLE set. Assigning a role ENABLES the element and says what it is painted in; an empty value is that element off, which is what un draws by default and what both are here.
#
# Decorators come out of the CONVERSATION's rows rather than the screen's, so the window shortens by exactly the rows drawn. On a terminal too short for both, they come off whole and the conversation keeps its rows.
[decorators]
# A pinned row above the conversation: un's version, the session id, the project root.
status_bar = ""
# What that row SAYS - a format string, not a role. `{version}` is `un v1.2`, `{session}` is `session <id>`, `{project}` is the project root, and anything else you type appears as written. The value below is what un draws when no skin names this key.
status_bar_text = " {version}  {session}  {project} "
# A rule under the bar and another above the footer, fencing the conversation off from the decorators either side of it.
inner_divider = ""

[layout]
# `condensed = true` removes the empty lines between responses.
condensed = false

# Names drawn in the conversation. `main` is what a tool call from the main conversation is prefixed with (`main: Read(...)`); a subagent's call is prefixed with the agent's own name. An empty value draws no name on the main conversation's calls.
[labels]
main = "ün"
