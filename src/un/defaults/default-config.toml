# Launch configuration for un.

# --------------------------Theme----------------------------------
# Themes are defined in .un/themes and enabled here. Only one theme can be enabled at a time.
# theme = "ember"

# --------------------------Plugins----------------------------------
# Plugins are added to src/un/plugins/. src/un/plugins/stock/ are reserved for plugins that ship with un. Plugins are enabled here.
# Example:
# enable_plugin = ["plugin_name", "plugin2_name"]
enable_plugin = []
disable_plugin = []

# Every key above this line is a root key and must stay above the first [table] header.

# --------------------------Provider---------------------------------
# At least one provider/model needs to be set here with `main = true` so un knows it is the main agent. Additional providers/models can be enabled at the same time, and can be used for subagents, or just left on with no impact.
#
# `adaptor` - Takes one of two values:
#               - openai which uses an openai compatable API to interface with providers
#               - anthropic which is configured to work optimally with anthropics features.
#             These can be extended with plugins.
# `url`     - The API endpoint for the provider.
# `model`   - The model you want to use. Use whatever string the provider requires.
# `effort`  - How hard the model should think: low, medium, high, xhigh or max.
# `main`    - Set enable = true to make this the provider for the main agent. Only one provider can be set to main.

# [providers.anthropic]
# adaptor = "anthropic"
# model = "claude-opus-5"
# effort = "medium"
# main    = true

# [providers.openai]
# adaptor = "openai"
# url     = "https://api.openai.com/v1"
# model   = "gpt-5"
# api_key = "OPENAI_API_KEY"
# main    = false

# [providers.ollama]
# adaptor = "openai"
# url     = "http://localhost:11434/v1"
# model   = "qwen2.5-coder:7b"
# main    = false

# --------------------------Subagents----------------------------------
# Subagents are defined in .un/agents/ and enabled here. The agent_name is the name value in the agent's yaml front matter.
# Example:
# [agents.agent_name]
# enable = true

# Two bounds sit directly under [agents], above any [agents.agent_name] table. Both are whole numbers, 0 or more; a bad one turns every agent off.
# `max_task_depth` - how deep a chain of subagents may go. The main agent is depth 0; an agent at this depth cannot call Task. 0 means no subagents.
# `max_running`    - how many subagents may run at the same time; a spawn past it is refused. 0 means no subagents.
# [agents]
# max_task_depth = 3
# max_running = 20

# --------------------------Skills-----------------------------------
# Skills live in .un/skills/ and are enabled here, by DIRECTORY name. A skill nobody enables is not indexed and the Skill tool refuses it by name, so an agent is told it is off rather than told it does not exist. Skills cost prompt context and are instructions a later session reads, so opting in is the default.
# skill_name here is the skill's directory name under .un/skills/, not the name value in its yaml front matter.
# Example:
# [skills.skill_name]
# enable = true

# --------------------------Hooks--------------------------------------
# Hooks are defined in .un/hooks/ and enabled here. hook_name here is the name value in the hook's yaml front matter.
# Example:
# [hooks.hook_name]
# enable = true

# --------------------------Rules--------------------------------------
# Rules are defined in .un/rules/ and enabled here. A rule is text injected into the session.
# rule_name here is the rule's filename stem under .un/rules/, not the name value in its yaml front matter.
# Example:
# [rules.rule_name]
# enable = true

# --------------------------Keys----------------------------------------
# The REPL's quick keys, when your terminal already owns one of them. Every entry replaces
# a default; anything you leave out keeps the key it has below, and no table at all is the
# keyboard un has always had. A move applies at the prompt AND while a turn is running.
# Write a control key as `ctrl-e` and an Alt key as `alt-e`; the two combine as
# `ctrl-alt-e`, in either order. un's own messages spell them back the same way.
#
# The twelve you may move, at the keys they carry by default:
#   expand    = "ctrl-o"         transcript  = "ctrl-t"
#   editor    = "ctrl-x ctrl-e"  compose     = "alt-enter"
#   scroll_up = "up"             scroll_down = "down"
#   page_up   = "pageup"         page_down   = "pagedown"
#   top       = "home"           bottom      = "end"
#   menu_scroll_up = "ctrl-up"   menu_scroll_down = "ctrl-down"
#
# menu_scroll_up and menu_scroll_down scroll the conversation while an AskUser menu is open,
# where page_up and page_down scroll it too.
#
# Enter, Ctrl-C and Ctrl-D are reserved, and cannot be used.
#
# Shift has no `shift-` prefix; write prompt_toolkit's own names (`s-up`, `s-tab`, `c-s-left`, ...).
# They work for editor, compose, top, bottom, menu_scroll_up and menu_scroll_down, not for the six actions that also run while a turn is running.
# (Shift-Enter does add a line to the input box on a terminal that sends it, but it is not an action and cannot be named here - it rides on whatever key `compose` holds.)
#
# Example:
# [keys]
# expand = "ctrl-alt-e"

# --------------------------Services------------------------------------
# Services are built in, but you can disable them or disable parts of them here.
#
# `self_learning` is the service that watches a session for things worth remembering, either as a skill or a memory.
# `enable = false` stops every background pass and withdraws the activation exception the detector, admitter, implementor, accuracy-auditor and memory-editor agents get.
[self_learning]
enable = true
# With visibility set to true you will see notes during the session of the self-learning agents performing their work.
visibility = true

# Curation, off until the memory table exists. Nothing is retired for going unread.
# Once every `every_days`, at the start of a session, the pass writes `.un/learning/memory-curation-report.md`: pointers with no file, files with no pointer, possibly superseded pairs, what the prompt is missing, and what was retired since the last report.
# `revise` runs two agents once the report is written. The `accuracy-auditor` checks the next `check_batch` memories against the tree, and its findings go to `.un/learning/accuracy-findings.md`. The `memory-editor` then reads every memory, corrects or retires what the findings show wrong, and merges, renames or promotes what has drifted, writing without asking.
# Off until you turn it on. It is the only part of curation that rewrites what the agent believes rather than reporting on it.
# [self_learning.curate.memory]
# enable = true
# every_days = 7
# revise = true
# check_batch = 10

# The skills table takes only `enable`.
# [self_learning.curate.skills]
# enable = true

# `compaction` watches how full each conversation's context window is - main, subagent, workflow or learning pass - and, when turned on, summarises its earlier history.
# `threshold` is the share of the window, a number between 0 and 1, at which you are noted once per conversation that it is nearing its limit, and at which compaction starts when `enable` is on.
# [compaction]
# threshold = 0.8

# With `enable` on and a `model` named, the note is not given. Instead, once a conversation's estimated next request reaches `threshold` of the lower of its own model's window and the summary model's, the summary model writes a summary that replaces everything before the newest exchange in what is sent. The session's messages and its record are left as they are, and each summary is recorded as a `compacted` event.
# `model` names the summary model and is required with `enable` on. `provider` names the [providers.<name>] profile the summary call goes to, and defaults to the conversation's own; the call runs at the conversation's effort.
# The summary prompt ships with un. A readable `.un/compaction.md` replaces it, and `un install` does not write one.
# A session model with no known window never compacts. A summary call that fails is reported, and that send goes out uncompacted.
# enable = false
# provider = "<profile name>"
# model = "<summary model>"

# --------------------------Workflows---------------------------------
# Workflows are python driven processes that can invoke agents, using core un capabilities.
