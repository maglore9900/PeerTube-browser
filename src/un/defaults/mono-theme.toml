# mono - no colour, shape only. For a terminal whose palette you would rather keep,
# and for anywhere colour is not carried. See ember.toml for what each role is.

[roles]
assistant = "default"
note = "default"
bullet = "bold"
tool = "bold"
tool_result = "dim"
agent = "italic"
user = "bold"
user_text = ""
banner_art = "bold"
banner_text = "default"
error = "bold reverse"
status = "dim"
time = "dim"
waiting = "dim italic"
border = "dim"
pending = "dim italic"
ask = "bold reverse"
code = "bw"

# The characters every rule and border is drawn with: the banner, the input frame and the choice modal. Optional like the roles above and merged the same way, per key: name `horizontal` alone and the corners stay built-in. The seven below are the WHOLE set, and these values ARE the built-in ones - shape is all this skin has, so it keeps un's box.
# Swap in "+" corners and "-" fill for a terminal that draws no box characters.
[glyphs]
top_left = "╭"
top_right = "╮"
bottom_left = "╰"
bottom_right = "╯"
horizontal = "─"
vertical = "│"
# The fill for the rules `[decorators]` fences the conversation with. Its own key rather than the box rule's, so a skin can move one without the other; it ships as the same character so the built-in screen reads as one box.
inner_divider = "─"

# Elements the screen can carry beyond the conversation and its footer. The two below are the WHOLE set. Assigning a role ENABLES the element and says what it is painted in; an empty value is that element off, which is what un draws by default and what both are here.
#
# Decorators come out of the CONVERSATION's rows rather than the screen's, so the window shortens by exactly the rows drawn. On a terminal too short for both, they come off whole and the conversation keeps its rows.
[decorators]
# A pinned row above the conversation: un's version, the session id, the project root.
status_bar = ""
# A rule under the bar and another above the footer, fencing the conversation off from the decorators either side of it.
inner_divider = ""

[layout]
# `condensed = true` removes the empty lines between responses.
condensed = false

[labels]
main = "ün"
