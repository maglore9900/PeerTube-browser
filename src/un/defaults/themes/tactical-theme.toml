
[roles]
# The model's own prose. A warm-biased grey rather than a neutral one, so it sits apart from `user_text` without either reading as coloured.
assistant = "#a8a8a1"
# What un itself says rather than the model: a slash result, a refusal, an advisory from a plugin.
note = "#456F85"
# The gutter mark. Foreground, not accent: the mark carries the grammar, and spending the accent here would leave nothing louder for a tool call.
bullet = "#8f8f87"
# The tool call line. The one saturated colour on the screen.
tool = "#e61919"
tool_result = "#7b7b74"
# The `name:` in front of a tool call.
agent = "#b4b4ae"
# The `>` marker, and your own prose beside it. The marker stays pure white so the input row reads as the only live thing between turns.
user = "bold #ffffff"
user_text = "#eaeaea"
# Inside the welcome box: the art or wordmark, then the version, session and path lines.
banner_art = "bold #b4b4ae"
banner_text = "#a8a8a1"
error = "bold #ff552a"
# You ended the turn. Amber rather than red: a turn you stopped is not a fault.
interrupted = "bold #c4763f"
status = "#5e5e58"
# The clock in front of each conversation line, in your local time.
time = "#5e5e58"
# The pulse. The only green on the screen - nothing else earns the phosphor channel.
# waiting = "#4af626"
waiting = "#879C67"
border = "#3a3a36"
# Committed with an Enter mid-turn: typed, queued, not yet run.
pending = "#8a7a50"
ask = "#b4b4ae"
# Not a colour: the pygments theme for a fenced code block. "bw" is the purist choice for this palette - no colour in code at all - at the cost of all highlighting.
code = "one-dark"


[glyphs]
# The characters every rule and border is drawn with: the banner, the input frame and the
# choice modal. Ascii throughout here: this is a terminal that predates box drawing, and a
# `+` corner is the whole of what says so.
#
# The seven keys below are the WHOLE set. Every one is optional and merges on its own - name
# `horizontal` alone and the corners stay the built-in `╭ ╮ ╰ ╯`, with `│` for `vertical`
# and `─` for `horizontal`.
top_left = "+"
top_right = "+"
bottom_left = "+"
bottom_right = "+"
horizontal = "-"
vertical = "|"

bullet = ">"
user = "▶"
# The fill for the rules `[decorators]` fences the conversation with. Its own key rather than the box rule's, so a skin can move one without the other; it ships as the same character so the built-in screen reads as one box.
inner_divider = "/"

[decorators]
# Elements the screen can carry beyond the conversation and its footer. The two keys below are the WHOLE set. Assigning a role ENABLES the element and says what it is painted in; leaving one out is that element off, which is what every other shipped skin does.
#
# They come out of the CONVERSATION's rows, not the screen's, and come off whole on a terminal too short to carry them.
#
# The pinned telemetry row: un's version, the session id, the project root.
status_bar = "#5e5e58"
status_bar_text = "{version}  //  {session}  +++  [ {project} ]  +++"
# A rule under the bar and another above the footer, fencing the conversation off from the decorators either side of it.
inner_divider = "#BA1616"

[labels]
main = "ün"
