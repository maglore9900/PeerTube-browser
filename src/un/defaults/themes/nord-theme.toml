# nord - cool blues, the palette un's default is cut from. `un install` copies it to
# .un/themes/nord.toml, and naming it with `theme = "nord"` gives you these values even after the default is retuned - which is why it is its own file and not the built-in one.
# That table is default-theme.toml, identical to this for now.
#
# See ember.toml for what each role is.
#
# A key says what the text IS, never what it looks like - `tool_result`, not `dim cyan` - which is what lets a skin restyle without the renderer knowing it did. Values are rich style strings and pass through untouched.

[roles]
# The model's own prose.
assistant = "#9e9e9e"
# What un itself says rather than the model: a slash result, a refusal, an advisory from a plugin.
note = "#9e9e9e"
bullet = "#88c0d0"
tool = "bold #81a1c1"
tool_result = "dim #d8dee9"
agent = "#ebcb8b"
# The `>` marker, and the operator's own text beside it. Two roles rather than one so a skin can mark without colouring the prose, or the other way round.
#
# An explicit triplet rather than `white`: rich reads `white` as ANSI colour 7, which a terminal paints with the same grey it paints `default` - so the operator's own line and the model's answer arrived the same colour whatever the two roles said.
user = "bold #ffffff"
user_text = "#ffffff"
# Inside the welcome box: the art or wordmark, then the version, session and path lines.
banner_art = "#88c0d0"
banner_text = "#9e9e9e"
error = "bold #bf616a"
interrupted = "bold #d08770"
status = "dim #6c7a94"
# The clock in front of each conversation line, in your local time.
time = "dim #6c7a94"
waiting = "#ebcb8b"
border = "dim #5e81ac"
# A line committed with an Enter while a turn was still running: typed, not yet run.
pending = "dim #ebcb8b"
# The choice modal while it is open - its border and its text.
ask = "#ffffff"
code = "nord-darker"

# The characters every rule and border is drawn with: the banner, the input frame and the choice modal. Optional like the roles above and merged the same way, per key: name `horizontal` alone and the corners stay built-in. The seven below are the WHOLE set, and these values ARE the built-in ones. An ascii set - "+" corners and "-" fill - suits a terminal whose font draws box characters at a mismatched weight.
[glyphs]
top_left = "╭"
top_right = "╮"
bottom_left = "╰"
bottom_right = "╯"
horizontal = "─"
vertical = "│"
# The fill for the rules `[decorators]` fences the conversation with. Its own key rather than the box rule's, so a skin can move one without the other; it ships as the same character so the built-in screen reads as one box.
inner_divider = "─"

# Elements the screen can carry beyond the conversation and its footer. The two below are the WHOLE set. Assigning a role ENABLES the element and says what it is painted in; an empty value is that element off, which is what un draws by default and what both are here.
#
# Decorators come out of the CONVERSATION's rows rather than the screen's, so the window shortens by exactly the rows drawn. On a terminal too short for both, they come off whole and the conversation keeps its rows.
[decorators]
# A pinned row above the conversation: un's version, the session id, the project root.
status_bar = ""
# A rule under the bar and another above the footer, fencing the conversation off from the decorators either side of it.
inner_divider = ""

[layout]
# `condensed = true` removes the empty lines between responses.
condensed = false

[labels]
main = "ün"
