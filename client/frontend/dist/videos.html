  <body>
    <div id="app" class="videos-app">
      <header class="videos-header">
        <div>
          <p class="eyebrow">PeerTube videos</p>
          <h1>Home</h1>
          <p class="subtitle"></p>
        </div>
        <nav class="header-nav">
          <a class="nav-link" href="/search.html">Search</a>
          <a class="nav-link" href="/channels.html">Channels</a>
          <a class="nav-link active" href="/">Home</a>
          <a class="nav-link" href="/likes.html">Likes</a>
          <a class="nav-link" href="/about.html">About</a>
          <button id="show-profile-header" class="nav-link nav-button" type="button">Profile</button>
        </nav>
      </header>

      <main class="videos-main">
        <section class="summary" hidden>
          <div>
            <div id="summary-counts"></div>
            <div id="summary-meta" class="summary-meta"></div>
          </div>
          <div class="summary-actions">
            <a id="reset-feed" class="ghost-link" href="/?mode=recommendations">Back to recommended</a>
            <div class="feed-modes" role="group" aria-label="Feed mode">
              <button class="ghost-button" type="button" data-feed-mode="recommendations" aria-pressed="false">Recommendations</button>
              <button class="ghost-button" type="button" data-feed-mode="hot" aria-pressed="false">Hot</button>
              <button class="ghost-button" type="button" data-feed-mode="recent" aria-pressed="false">Recent</button>
              <button class="ghost-button" type="button" data-feed-mode="random" aria-pressed="false">Random</button>
              <button class="ghost-button" type="button" data-feed-mode="popular" aria-pressed="false">Popular</button>
            </div>
          </div>
        </section>

        <section id="video-cards" class="cards-grid"></section>
        <div id="feed-sentinel" class="feed-sentinel" aria-hidden="true"></div>
      </main>
    </div>

    <div id="profile-modal" class="modal" hidden>
      <div class="modal-backdrop" data-modal-close></div>
      <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="profile-modal-title">
        <header class="modal-header">
          <h2 id="profile-modal-title">Profile</h2>
          <button id="profile-modal-close" class="ghost-button" type="button">Close</button>
        </header>
        <section id="profile-section" class="profile-section" aria-label="Profile key"></section>
      </div>
    </div>
