<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; connect-src 'self' https:; frame-src https:; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <link rel="icon" href="/favicon.png" />
    <title>Video - PeerTube - Browser</title>
    <script type="module" crossorigin src="/assets/video-pSg73mMI.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/api-base-ouyYHZ10.js">
    <link rel="modulepreload" crossorigin href="/assets/reactions-T0agINKk.js">
    <link rel="modulepreload" crossorigin href="/assets/key-rejected-Bz9wLg_W.js">
    <link rel="modulepreload" crossorigin href="/assets/videos-MqFmseiX.js">
    <link rel="modulepreload" crossorigin href="/assets/safe-url-hDO6pUEa.js">
    <link rel="stylesheet" crossorigin href="/assets/video-KpoIp_n6.css">
  </head>
  <body>
    <div id="app" class="video-page">
      <header class="videos-header">
        <div>
          <p class="eyebrow">PeerTube videos</p>
        </div>
        <nav class="header-nav">
          <a class="nav-link" href="/">Home</a>
          <a class="nav-link" href="/likes.html">Likes</a>
          <a id="similar-link" class="nav-link" href="/">Similar videos</a>
          <a class="nav-link" href="/search.html">Search</a>
          <a class="nav-link" href="/about.html">About</a>
        </nav>
      </header>

      <main class="video-main">
        <section class="player-card">
          <div class="player-frame">
            <iframe
              id="video-embed"
              title="Video player"
              allowfullscreen
              referrerpolicy="no-referrer"
              sandbox="allow-scripts allow-same-origin"
            ></iframe>
            <div id="translate-overlay" class="translate-overlay" hidden></div>
          </div>
          <div class="player-info">
            <h2 id="video-title" class="video-title">Video page</h2>
            <div class="channel-row">
              <div id="channel-avatar" class="channel-avatar" aria-hidden="true"></div>
              <div class="channel-meta">
                <div class="channel-line">
                  <div id="video-channel" class="video-channel"></div>
                  <div class="meta-chips">
                    <div id="instance-meta" class="instance-meta">
                      <span id="instance-avatar" class="instance-avatar" aria-hidden="true"></span>
                      <a id="instance-link" class="instance-link" href="#" target="_blank" rel="noreferrer"></a>
                    </div>
                    <div id="account-meta" class="instance-meta">
                      <span id="account-avatar" class="instance-avatar" aria-hidden="true"></span>
                      <a id="account-link" class="instance-link" href="#" target="_blank" rel="noreferrer"></a>
                    </div>
                  </div>
                </div>
                <div class="channel-subline">
                  <span id="channel-subscribers" class="channel-subscribers"></span>
                  <span id="video-published" class="channel-published"></span>
                </div>
                <div class="block-actions">
                  <button id="block-channel" class="ghost-button" type="button" disabled>Block channel</button>
                  <button id="block-account" class="ghost-button" type="button" disabled>Block account</button>
                  <span id="block-status" class="block-status" role="status"></span>
                </div>
              </div>
            </div>
            <div class="video-meta-row">
              <div class="video-metrics">
                <span id="video-views" class="metric">
                  <span class="metric-icon" aria-hidden="true"></span>
                  <span class="metric-value">0</span>
                </span>
              </div>
              <div class="player-actions">
                <button id="like-button" class="ghost-button icon-button" type="button" aria-pressed="false" disabled>
                  <span class="reaction-label">Like</span>
                  <span class="count" id="like-count">0</span>
                </button>
                <button
                  id="dislike-button"
                  class="ghost-button icon-button"
                  type="button"
                  aria-pressed="false"
                  disabled
                >
                  <span class="reaction-label">Dislike</span>
                  <span class="count" id="dislike-count">0</span>
                </button>
                <span id="reaction-status" class="block-status" role="status"></span>
                <button id="translate-toggle" class="ghost-button" type="button" aria-pressed="false" hidden>Translate</button>
                <span id="translate-status" class="block-status" role="status"></span>
                <a id="original-link" class="ghost-link" href="#" target="_blank" rel="noreferrer">
                  Open original
                </a>
              </div>
            </div>
            <dl id="video-taxonomy" class="video-taxonomy">
              <div id="video-category" class="taxonomy-item" hidden>
                <dt>Category</dt>
                <dd id="video-category-value"></dd>
              </div>
              <div id="video-language" class="taxonomy-item" hidden>
                <dt>Language</dt>
                <dd id="video-language-value"></dd>
              </div>
              <div class="taxonomy-item">
                <dt>Tags</dt>
                <dd id="video-tags" class="tag-list"></dd>
              </div>
            </dl>
            <div id="video-description" class="video-description description-collapsed"></div>
            <button
              id="description-toggle"
              class="ghost-button description-toggle"
              type="button"
              aria-controls="video-description"
              aria-expanded="false"
              hidden
            >
              Show more
            </button>
          </div>
        </section>

        <section id="comments-section" class="comment-card" aria-labelledby="comments-heading">
          <div class="section-header">
            <h3 id="comments-heading">Comments</h3>
          </div>
          <div id="comments-list" class="comments-list"></div>
          <p id="comments-status" class="comments-status" role="status">Loading comments…</p>
          <button id="comments-more" class="ghost-button comments-more" type="button" hidden>Load more comments</button>
        </section>

        <section id="similar-section" class="similar-card">
          <div class="section-header">
            <h3>Similar videos</h3>
            <a id="similar-link-inline" class="ghost-link" href="/">Open full list</a>
          </div>
          <div id="similar-videos" class="similar-grid">
            <div class="loading">Loading...</div>
          </div>
          <div id="similar-sentinel" class="similar-sentinel" aria-hidden="true"></div>
        </section>
      </main>
    </div>

  </body>
</html>
