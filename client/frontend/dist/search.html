<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; connect-src 'self' https:; frame-src https:; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <link rel="icon" href="/favicon.png" />
    <title>Search - PeerTube - Browser</title>
    <script type="module" crossorigin src="/assets/search-CmhXs03O.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/safe-url-Bow8sMhM.js">
    <link rel="modulepreload" crossorigin href="/assets/video-card-CDcdF3r1.js">
    <link rel="modulepreload" crossorigin href="/assets/cache-CODOoMrz.js">
    <link rel="modulepreload" crossorigin href="/assets/key-rejected-CufeBCHH.js">

    <link rel="stylesheet" crossorigin href="/assets/videos-ryhGk2WT.css">
  </head>
  <body>
    <div id="app" class="videos-app">
      <header class="videos-header">
        <div>
          <p class="eyebrow">PeerTube videos</p>
          <h1>Search</h1>
          <p class="subtitle">Find videos across every indexed instance.</p>
        </div>
        <nav class="header-nav">
          <a class="nav-link active" href="/search.html">Search</a>
          <a class="nav-link" href="/channels.html">Channels</a>
          <a class="nav-link" href="/">Home</a>
          <a class="nav-link" href="/about.html">About</a>
        </nav>
      </header>

      <main class="videos-main">
        <section class="search-controls">
          <form id="search-form" class="search-form" role="search">
            <label class="search-field">
              <span class="visually-hidden">Search videos</span>
              <input
                id="search-input"
                type="search"
                name="q"
                placeholder="Search titles, tags, channels..."
                autocomplete="off"
                autofocus
              />
            </label>
            <label class="search-sort">
              <span>Sort</span>
              <select id="search-sort">
                <option value="relevance">Relevance</option>
                <option value="published_at">Newest</option>
                <option value="views">Most viewed</option>
                <option value="popularity">Most popular</option>
              </select>
            </label>
            <button id="search-submit" class="ghost-button" type="submit">Search</button>
          </form>
          <div id="search-status" class="search-status" role="status" aria-live="polite"></div>
        </section>

        <section id="search-results" class="cards-grid"></section>

        <div class="search-more">
          <button id="search-more" class="ghost-button" type="button" hidden>Load more</button>
        </div>
      </main>
    </div>
  </body>
</html>
