[project]
name = "unstable-number"
version = "1.4.2"
description = "A security focused, modular, agentic harness. CLI only."
requires-python = ">=3.12"
dependencies = ["anthropic>=0.60", "ast-grep-cli>=0.45.3,<0.46", "openai>=1.60", "pillow>=11", "pypdf>=6.19.0,<7", "prompt_toolkit>=3.0.53,<4", "pyyaml>=6", "rich>=13"]

[project.scripts]
un = "un.plugins.stock.cli:run"

# Every plugin this project ships.

[project.entry-points."un.plugins.stock"]
anthropic_api = "un.plugins.stock.anthropic_provider"
ast_grep = "un.plugins.stock.ast_grep"
ask_user = "un.plugins.stock.ask_user"
commands = "un.plugins.stock.slash"
context = "un.plugins.stock.context"
file_system = "un.plugins.stock.fs"
git_read_only = "un.plugins.stock.git_ro"
hooks = "un.plugins.stock.hooks"
init = "un.plugins.stock.install"
interactive = "un.plugins.stock.repl"
learning = "un.plugins.stock.learning"
memory = "un.plugins.stock.memory"
oauth = "un.plugins.stock.oauth"
openai_api = "un.plugins.stock.openai_provider"
rules = "un.plugins.stock.rules"
session_transcripts = "un.plugins.stock.transcript"
session_view = "un.plugins.stock.session_view"
shell_access = "un.plugins.stock.shell"
skills = "un.plugins.stock.skills"
subagents = "un.plugins.stock.subagents"
themes = "un.plugins.stock.theme"
tools = "un.plugins.stock.tools"
workflows = "un.plugins.stock.workflows"

# User installed plugins.

[project.entry-points."un.plugins"]
#un.plugins.name_of_plugin

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/un"]
